# Tiny Tapeout project information
project:
  title:        "Viterbi Decoder"      # Project title
  author:       "Ashvin Verma"      # Your name
  discord:      "ashverma"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Hardware Viterbi decoder for K=5 convolutional code (23/35 octal), 16 states, rate 1/2, dual-mode: raw streaming + UART byte batch"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ashvin_viterbi"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "viterbi_core.v"
    - "branch_metric.v"
    - "expected_bits.v"
    - "ham2.v"
    - "ham3.v"
    - "acs_core.v"
    - "pm_bank.v"
    - "survivor_mem.v"
    - "traceback_v2.v"
    - "sym_unpacker_4x.v"
    - "sym_unpacker_2x3.v"
    - "bit_packer_8x.v"
    - "conv_encoder.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "M0:rx_sym_valid / M1:byte_valid"
  ui[1]: "M0:rx_sym[0]"
  ui[2]: "M0:rx_sym[1]"
  ui[3]: "force_state0 (both modes)"
  ui[4]: "M1:read_ack"
  ui[5]: "(unused)"
  ui[6]: "(unused)"
  ui[7]: "mode_sel (0=raw, 1=byte batch)"

  # Outputs
  uo[0]: "M0:dec_bit_valid / M1:byte_in_ready"
  uo[1]: "M0:dec_bit / M1:byte_out_valid"
  uo[2]: "rx_sym_ready (both modes)"
  uo[3]: "M1:busy"
  uo[4]: "M1:done"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "M1:data_io[0]"
  uio[1]: "M1:data_io[1]"
  uio[2]: "M1:data_io[2]"
  uio[3]: "M1:data_io[3]"
  uio[4]: "M1:data_io[4]"
  uio[5]: "M1:data_io[5]"
  uio[6]: "M1:data_io[6]"
  uio[7]: "M1:data_io[7]"

# Do not change!
yaml_version: 6
